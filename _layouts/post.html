---
layout: default
---
{%- include language.html -%}
<article lang="{{ content_lang | escape }}" class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <meta itemprop="inLanguage" content="{{ content_lang | escape }}">
  <a lang="{{ ui_lang }}" data-i18n="all_posts" class="post-back" href="{{ '/' | relative_url }}">{{ ui.all_posts }}</a>

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time>{% if page.author %} · <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author | escape }}</span></span>{% endif %}</p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>

</article>
