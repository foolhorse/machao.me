{%- include language.html -%}
<!DOCTYPE html>
<html lang="{{ content_lang | escape }}" data-ui-lang="{{ ui_lang }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main class="page-content">
      <div class="wrapper">
      {{ content }}
      </div>
    </main>
    {% include footer.html %}
    <script id="i18n-data" type="application/json">{{ site.data.i18n | jsonify }}</script>
    <script src="{{ "/js/main.js" | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>

</html>
