<header class="site-header">
  <div class="wrapper">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav" lang="{{ ui_lang }}" aria-label="{{ ui.navigation | escape }}" data-i18n-aria="navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %} data-i18n="posts">{{ ui.posts }}</a>
        {% for my_page in site.pages %}
          {% if my_page.title and my_page.nav_exclude != true %}
        <a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} aria-current="page"{% endif %}{% if my_page.url == "/about/" %} data-i18n="about"{% elsif my_page.url == "/tags/" %} data-i18n="tags"{% else %} lang="{{ my_page.lang | default: 'zh' | escape }}"{% endif %}>{% if my_page.url == '/about/' %}{{ ui.about }}{% elsif my_page.url == '/tags/' %}{{ ui.tags }}{% else %}{{ my_page.title | escape }}{% endif %}</a>
          {% endif %}
        {% endfor %}
        <div class="theme-picker" hidden>
          <button class="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-options"><span class="theme-label">{{ ui.system }}</span><span aria-hidden="true"> ▾</span></button>
          <div class="theme-options" id="theme-options" role="group" aria-label="{{ ui.appearance | escape }}" data-i18n-aria="appearance" hidden>
            <label><input type="radio" name="theme" value="light"><span data-i18n="light">{{ ui.light }}</span></label>
            <label><input type="radio" name="theme" value="dark"><span data-i18n="dark">{{ ui.dark }}</span></label>
            <label><input type="radio" name="theme" value="system"><span data-i18n="system">{{ ui.system }}</span></label>
          </div>
        </div>
        <div class="language-picker" hidden>
          <button class="language-toggle" type="button" aria-expanded="false" aria-controls="language-options"><span class="language-label">{{ ui.language }}</span><span aria-hidden="true"> ▾</span></button>
          <div class="language-options" id="language-options" role="group" aria-label="{{ ui.interface_language | escape }}" data-i18n-aria="interface_language" hidden>
            <label><input type="radio" name="ui-language" value="zh"><span lang="zh">中文</span></label>
            <label><input type="radio" name="ui-language" value="en"><span lang="en">English</span></label>
          </div>
        </div>
      </nav>
    </div>
  </div>
</header>
