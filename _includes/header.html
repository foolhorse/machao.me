<header class="site-header">
  <div class="wrapper">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a>
        {% for my_page in site.pages %}
          {% if my_page.title and my_page.nav_exclude != true %}
        <a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} aria-current="page"{% endif %}>{% if my_page.url == '/about/' %}关于{% else %}{{ my_page.title | escape }}{% endif %}</a>
          {% endif %}
        {% endfor %}
        <button class="theme-toggle" type="button" hidden>暗色</button>
      </nav>
    </div>
  </div>
</header>
