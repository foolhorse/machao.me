<footer class="site-footer">
  <div class="wrapper">
    <div class="footer-inner">
      <span>© {{ site.title | escape }}</span>
      <div class="footer-links">
        {% if site.github_username %}<a href="https://github.com/{{ site.github_username | escape }}">GitHub</a>{% endif %}
        {% if site.twitter_username %}<a href="https://x.com/{{ site.twitter_username | escape }}">X</a>{% endif %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
    </div>
  </div>
</footer>
