---
layout: default
---
{%- include language.html -%}
<div class="home">
  <header class="home-intro">
    <h1 lang="{{ ui_lang }}" data-i18n="home_title">{{ ui.home_title }}</h1>
    <p lang="{{ ui_lang }}" data-i18n="home_description">{{ ui.home_description }}</p>
  </header>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <time class="post-meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y-%m-%d' }}</time>
      <h2><a lang="{{ post.lang | default: 'zh' | escape }}" class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    </li>
    {% endfor %}
  </ul>
</div>
